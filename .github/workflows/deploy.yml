name: Deploy Website to S3

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::761774875281:role/GitHubActions-S3-Deploy
          aws-region: ap-south-1

      - name: Deploy website to S3
        run: |
          aws s3 sync . s3://hisham-aws-project-2026 \
            --exclude ".git/*" \
            --exclude ".github/*"